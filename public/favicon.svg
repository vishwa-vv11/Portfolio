<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="vGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="vGradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="#090d16" stroke="#253859" stroke-width="8" filter="url(#shadow)"/>
  <rect x="36" y="36" width="440" height="440" rx="108" fill="none" stroke="#6ea2ff" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Left Stroke of V -->
  <polygon points="105,140 170,140 256,360 210,385 105,140" fill="url(#vGradLeft)"/>
  <!-- Right Stroke of V -->
  <polygon points="407,140 342,140 256,360 302,385 407,140" fill="url(#vGradRight)"/>

  <!-- Center Floating AI Spark Dot -->
  <circle cx="256" cy="220" r="14" fill="#ffffff"/>
  <circle cx="256" cy="220" r="22" fill="#84d9e8" opacity="0.4"/>
</svg>