<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="vGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Deep Matte Slate Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="#0b0e14" stroke="#1f2937" stroke-width="6" filter="url(#shadow)"/>
  <rect x="35" y="35" width="442" height="442" rx="109" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.12"/>

  <!-- Minimalist High-Precision Tech V -->
  <!-- Left wing -->
  <polygon points="135,150 178,150 256,335 256,378 222,378 135,150" fill="url(#vGrad)"/>
  <!-- Right wing -->
  <polygon points="377,150 334,150 256,335 256,378 290,378 377,150" fill="url(#vGrad)"/>
</svg>