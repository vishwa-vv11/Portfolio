<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="vrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="#ffffff" stroke="#e2e8f0" stroke-width="8" filter="url(#shadow)"/>

  <!-- VR Text Monogram -->
  <text x="256" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="240" font-weight="800" fill="url(#vrGrad)" text-anchor="middle" letter-spacing="-6">VR</text>

  <!-- AI Sparkle Star (top right) -->
  <path d="M 390 120 Q 390 148 362 148 Q 390 148 390 176 Q 390 148 418 148 Q 390 148 390 120 Z" fill="url(#sparkGrad)"/>
  <circle cx="390" cy="148" r="5" fill="#ffffff"/>
</svg>