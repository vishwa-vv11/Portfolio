<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ea2ff"/>
      <stop offset="100%" stop-color="#84d9e8"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Dark Slate Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="#090d16" stroke="#253859" stroke-width="8" filter="url(#glow)"/>
  <rect x="36" y="36" width="440" height="440" rx="108" fill="none" stroke="#6ea2ff" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Terminal >_ Prompt -->
  <!-- Greater-than '>' character -->
  <path d="M 140 165 L 182 165 L 290 256 L 182 347 L 140 347 L 244 256 Z" fill="url(#termGrad)"/>
  <!-- Underscore '_' character -->
  <rect x="290" y="322" width="105" height="25" rx="6" fill="url(#termGrad)"/>
</svg>